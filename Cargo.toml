[package]
name = "ecommerce-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "bigdecimal", "chrono"] }
bigdecimal = { version = "0.4", features = ["serde"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
argon2 = "0.6.0" 
jsonwebtoken = "11.0.0"
